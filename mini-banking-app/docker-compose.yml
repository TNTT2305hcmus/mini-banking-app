services:
  # CA dùng Postgres qua CA_DATABASE_URL trong .env.
  # Có thể trỏ tới Postgres local/Docker theo RUN_GUIDE hoặc remote khi cần.
  # ca-postgres:
  #   image: postgres:17-alpine
  #   environment:
  #     POSTGRES_DB: ${CA_DB_NAME:-ca_db}
  #     POSTGRES_USER: ${CA_DB_USER:-ca_user}
  #     POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
  #   volumes:
  #     - ca_postgres_data:/var/lib/postgresql/data
  #     - ./db/ca/migrations/001_init_ca.sql:/docker-entrypoint-initdb.d/001_init_ca.sql:ro
  #   healthcheck:
  #     test:
  #       - CMD-SHELL
  #       - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
  #     interval: 5s
  #     timeout: 5s
  #     retries: 10
  #     start_period: 10s
  #   restart: unless-stopped
  #   networks:
  #     - mini-banking

  ca-service:
    build:
      context: .
      dockerfile: ca-service/Dockerfile
      target: prod
    environment:
      GRPC_PORT: "50051"
      ROOT_CA_KEY_PATH: /certs/root-ca/ca.key
      ROOT_CA_CERT_PATH: /certs/root-ca/ca.crt
      ROOT_CA_KEY_PASSWORD: ${ROOT_CA_KEY_PASSWORD:?ROOT_CA_KEY_PASSWORD is required}
      ISSUED_CERTS_PATH: /certs/issued
      CA_STORE_BACKEND: postgres
      # Dùng CA_DATABASE_URL từ .env. Bỏ trống sẽ báo lỗi.
      CA_DATABASE_URL: ${CA_DATABASE_URL:?CA_DATABASE_URL is required}
      CERT_VALIDITY_DAYS: ${CERT_VALIDITY_DAYS:-365}
      CA_CRL_DISTRIBUTION_POINTS: ${CA_CRL_DISTRIBUTION_POINTS:-}
      CA_OCSP_SERVERS: ${CA_OCSP_SERVERS:-}
      GRPC_SERVER_CERT_PATH: /certs/grpc/ca-server.crt
      GRPC_SERVER_KEY_PATH: /certs/grpc/ca-server.key
    volumes:
      - ./ca-service/certs/root-ca:/certs/root-ca:ro
      - ./ca-service/certs/grpc:/certs/grpc:ro
      - ca_issued_certs:/certs/issued
    ports:
      - "${CA_GRPC_PORT:-50051}:50051"
    restart: unless-stopped
    networks:
      - mini-banking

  gateway-redis:
    image: redis:7.4-alpine
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --save
      - "60"
      - "1"
    volumes:
      - gateway_redis_data:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped
    networks:
      - mini-banking

  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
      target: prod
    environment:
      PORT: "3000"
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-http://localhost:5173}
      GATEWAY_REDIS_URL: ${GATEWAY_REDIS_URL:-redis://gateway-redis:6379}
      CA_CERT_PATH: /app/certs/grpc-ca.crt
      CA_GRPC_ADDR: ca-service:50051
      KDC_GRPC_ADDR: ${KDC_GRPC_ADDR:-kdc-service:50052}
      BANK_GRPC_ADDR: ${BANK_GRPC_ADDR:-banking-service:50053}
      EMAIL_USER: ${SMTP_USER:?SMTP_USER is required}
      EMAIL_PASS: ${SMTP_PASS:?SMTP_PASS is required}
      OTP_MAX_ATTEMPTS: ${OTP_MAX_ATTEMPTS:-5}
      OTP_EXPIRES_IN: ${OTP_EXPIRES_IN:-300}
      OTP_COOLDOWN: ${OTP_COOLDOWN:-60}
      GATEWAY_OTP_SECRET: ${GATEWAY_OTP_SECRET:?GATEWAY_OTP_SECRET is required}
      GATEWAY_JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      ADMIN_CA_DEMO_EMAIL: ${ADMIN_CA_DEMO_EMAIL:?ADMIN_CA_DEMO_EMAIL is required}
      ADMIN_CA_DEMO_PASSWORD: ${ADMIN_CA_DEMO_PASSWORD:?ADMIN_CA_DEMO_PASSWORD is required}
      ADMIN_CA_DEMO_TOKEN: ${ADMIN_CA_DEMO_TOKEN:?ADMIN_CA_DEMO_TOKEN is required}
    volumes:
      - ./api-gateway/certs/grpc-ca.crt:/app/certs/grpc-ca.crt:ro
    ports:
      - "${API_GATEWAY_PORT:-3000}:3000"
    depends_on:
      gateway-redis:
        condition: service_healthy
      ca-service:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          const net=require('net');const s=net.connect(3000,'127.0.0.1',()=>{s.end();process.exit(0)});s.on('error',()=>process.exit(1))
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - mini-banking

volumes:
  # ca_postgres_data:  # chỉ bật khi uncomment service ca-postgres
  ca_issued_certs:
  gateway_redis_data:

networks:
  mini-banking:
    name: mini-banking-network
    driver: bridge
