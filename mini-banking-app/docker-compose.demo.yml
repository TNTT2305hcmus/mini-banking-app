# docker-compose.demo.yml — Deploy demo environment (production-like, không có frontend dev server)
#
# Sử dụng:
#   docker compose -f docker-compose.demo.yml up --build -d
#
# Lưu ý:
# - Giống docker-compose.local.yml nhưng không có Vite dev server.
#   Frontend nên được build thành static files và serve qua nginx hoặc CDN.
# - Tất cả service đều `restart: unless-stopped`.
# - Redis giữ tên 'gateway-redis' đồng nhất với docker-compose.yml gốc.
# - CA dùng Neon/external DB. Để chạy offline, uncomment ca-postgres.
#
# Chuỗi lệnh đầy đủ:
#   1. scripts/gen-certs/gen-certs.sh     # sinh cert
#   2. docker compose -f docker-compose.demo.yml run --rm bank-migrate  # (nếu dùng migrate tool)
#   3. docker compose -f docker-compose.demo.yml up --build -d
#   4. scripts/demo/smoke-test.sh         # kiểm tra

services:
  # ─── Bank Postgres ─────────────────────────────────────────────────────
  bank-postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${BANK_DB_NAME:-banking}
      POSTGRES_USER: ${BANK_DB_USER:-banking}
      POSTGRES_PASSWORD: ${BANK_DB_PASSWORD:?BANK_DB_PASSWORD is required}
    volumes:
      - bank_postgres_data:/var/lib/postgresql/data
      - ./db/bank/migrations/001_init_bank.sql:/docker-entrypoint-initdb.d/001_init_bank.sql:ro
      - ./db/kdc/migrations/001_init_kdc.sql:/docker-entrypoint-initdb.d/010_init_kdc.sql:ro
      - ./db/kdc/migrations/002_add_audit_hash_chain.sql:/docker-entrypoint-initdb.d/011_kdc_audit_hash_chain.sql:ro
      - ./db/bank/seed_demo.sql:/docker-entrypoint-initdb.d/020_seed_demo.sql:ro
    # Không expose port ra ngoài trong demo deploy (internal only)
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    networks:
      - mini-banking

  # ─── CA Service ────────────────────────────────────────────────────────
  ca-service:
    build:
      context: .
      dockerfile: ca-service/Dockerfile
      target: prod
    environment:
      GRPC_PORT: "50051"
      ROOT_CA_KEY_PATH: /certs/root-ca/ca.key
      ROOT_CA_CERT_PATH: /certs/root-ca/ca.crt
      CLIENT_CA_KEY_PATH: /certs/intermediate/client-ca.key
      CLIENT_CA_CERT_PATH: /certs/intermediate/client-ca.crt
      ROOT_CA_KEY_PASSWORD: ${ROOT_CA_KEY_PASSWORD:?ROOT_CA_KEY_PASSWORD is required}
      ISSUED_CERTS_PATH: /certs/issued
      CA_STORE_BACKEND: postgres
      CA_DATABASE_URL: ${CA_DATABASE_URL:?CA_DATABASE_URL is required}
      CERT_VALIDITY_DAYS: ${CERT_VALIDITY_DAYS:-365}
      CA_CRL_DISTRIBUTION_POINTS: ${CA_CRL_DISTRIBUTION_POINTS:-}
      CA_OCSP_SERVERS: ${CA_OCSP_SERVERS:-}
      GRPC_SERVER_CERT_PATH: /certs/grpc/ca-server.crt
      GRPC_SERVER_KEY_PATH: /certs/grpc/ca-server.key
    volumes:
      - ./ca-service/certs/root-ca:/certs/root-ca:ro
      - ./ca-service/certs/intermediate:/certs/intermediate:ro
      - ./ca-service/certs/grpc:/certs/grpc:ro
      - ca_issued_certs:/certs/issued
    # Không expose gRPC port ra ngoài trong demo deploy — internal only
    healthcheck:
      test: [CMD-SHELL, "nc -z 127.0.0.1 50051 || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - mini-banking

  # ─── Redis ─────────────────────────────────────────────────────────────
  gateway-redis:
    image: redis:7.4-alpine
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --save
      - "60"
      - "1"
      # --requirepass bị bỏ: Redis không expose port ra ngoài trong file này
      # (không có ports: section), chỉ accessible qua Docker network nội bộ.
      # Không cần password cho demo nội bộ; thêm lại nếu expose port ra host.
    volumes:
      - gateway_redis_data:/data
    # Không expose port ra ngoài trong demo deploy
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped
    networks:
      - mini-banking


  # ─── KDC Service ───────────────────────────────────────────────────────
  kdc-service:
    build:
      context: .
      dockerfile: kdc-service/Dockerfile
      target: prod
    environment:
      GRPC_PORT: "50052"
      CA_PORT: ca-service:50051
      TGT_EXP: ${TGT_EXP:-10m}
      REDIS_URI: redis://gateway-redis:6379/0
      DATABASE_URL: postgres://${BANK_DB_USER:-banking}:${BANK_DB_PASSWORD:?BANK_DB_PASSWORD is required}@bank-postgres:5432/${BANK_DB_NAME:-banking}?sslmode=disable
      K_TGS_PATH: /certs/kdc/k_tgs.key
      KDC_PRIVATE_KEY_PATH: /certs/kdc/kdc-private.pem
      BANK_SERVICE_ID: bank-service
      BANK_SERVICE_KEY_PATH: /certs/kdc/k_tgs.key
      CA_CERT_PATH: /certs/grpc/grpc-ca.crt
      CA_SERVER_NAME: ca-service
      KDC_SERVER_CERT_PATH: /certs/kdc/kdc-server.crt
      KDC_SERVER_KEY_PATH: /certs/kdc/kdc-server.key
      KDC_SERVER_CA_CERT_PATH: /certs/grpc/grpc-ca.crt
    volumes:
      - ./kdc-service/certs:/certs/kdc:ro
      - ./kdc-service/certs/grpc-ca.crt:/certs/grpc/grpc-ca.crt:ro
    depends_on:
      bank-postgres:
        condition: service_healthy
      gateway-redis:
        condition: service_healthy
      ca-service:
        condition: service_healthy
    healthcheck:
      test: [CMD-SHELL, "nc -z 127.0.0.1 50052 || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    networks:
      - mini-banking

  # ─── Banking Service ────────────────────────────────────────────────────
  banking-service:
    build:
      context: .
      dockerfile: banking-service/Dockerfile
      target: prod
    environment:
      BANK_GRPC_PORT: "50053"
      DATABASE_URL: postgres://${BANK_DB_USER:-banking}:${BANK_DB_PASSWORD:?BANK_DB_PASSWORD is required}@bank-postgres:5432/${BANK_DB_NAME:-banking}?sslmode=disable
      REDIS_URI: redis://gateway-redis:6379/0
      BANK_KEY: ${BANK_KEY:?BANK_KEY is required}
      CA_SERVICE_ADDRESS: ca-service:50051
      CA_CERT_PATH: /certs/grpc/grpc-ca.crt
      CA_TLS_SERVER_NAME: ca-service
      BANK_CERT_PATH: /certs/grpc/bank-server.crt
      BANK_KEY_PATH: /certs/grpc/bank-server.key
    volumes:
      - ./banking-service/certs/grpc:/certs/grpc:ro
    depends_on:
      bank-postgres:
        condition: service_healthy
      gateway-redis:
        condition: service_healthy
      ca-service:
        condition: service_healthy
    healthcheck:
      test: [CMD-SHELL, "nc -z 127.0.0.1 50053 || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    networks:
      - mini-banking

  # ─── API Gateway ───────────────────────────────────────────────────────
  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
      target: prod
    environment:
      PORT: "3000"
      NODE_ENV: production
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-http://localhost:5173}
      GATEWAY_REDIS_URL: redis://gateway-redis:6379/0
      CA_CERT_PATH: /app/certs/grpc-ca.crt
      CA_GRPC_ADDR: ca-service:50051
      KDC_GRPC_ADDR: kdc-service:50052
      BANK_GRPC_ADDR: banking-service:50053
      EMAIL_USER: ${SMTP_USER:?SMTP_USER is required}
      EMAIL_PASS: ${SMTP_PASS:?SMTP_PASS is required}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      OTP_MAX_ATTEMPTS: ${OTP_MAX_ATTEMPTS:-5}
      OTP_EXPIRES_IN: ${OTP_EXPIRES_IN:-300}
      OTP_COOLDOWN: ${OTP_COOLDOWN:-60}
      RATE_LIMIT_DISABLED: ${RATE_LIMIT_DISABLED:-0}
      RATE_LIMIT_AS_WINDOW_SECONDS: ${RATE_LIMIT_AS_WINDOW_SECONDS:-300}
      RATE_LIMIT_AS_MAX: ${RATE_LIMIT_AS_MAX:-10}
      RATE_LIMIT_TGS_WINDOW_SECONDS: ${RATE_LIMIT_TGS_WINDOW_SECONDS:-300}
      RATE_LIMIT_TGS_MAX: ${RATE_LIMIT_TGS_MAX:-10}
      RATE_LIMIT_BANK_WINDOW_SECONDS: ${RATE_LIMIT_BANK_WINDOW_SECONDS:-60}
      RATE_LIMIT_BANK_MAX: ${RATE_LIMIT_BANK_MAX:-20}
      RATE_LIMIT_OTP_WINDOW_SECONDS: ${RATE_LIMIT_OTP_WINDOW_SECONDS:-600}
      RATE_LIMIT_OTP_MAX: ${RATE_LIMIT_OTP_MAX:-3}
      ADMIN_SEC_DEMO_EMAIL: ${ADMIN_SEC_DEMO_EMAIL:-}
      ADMIN_SEC_DEMO_PASSWORD: ${ADMIN_SEC_DEMO_PASSWORD:-}
      ADMIN_SEC_DEMO_TOKEN: ${ADMIN_SEC_DEMO_TOKEN:-}
      GATEWAY_OTP_SECRET: ${GATEWAY_OTP_SECRET:?GATEWAY_OTP_SECRET is required}
      GATEWAY_JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      ADMIN_ACTIVATION_TTL_SECONDS: ${ADMIN_ACTIVATION_TTL_SECONDS:-900}
    volumes:
      - ./api-gateway/certs/grpc-ca.crt:/app/certs/grpc-ca.crt:ro
    ports:
      - "${API_GATEWAY_PORT:-3000}:3000"
    depends_on:
      gateway-redis:
        condition: service_healthy
      ca-service:
        condition: service_healthy
      kdc-service:
        condition: service_healthy
      banking-service:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          const net=require('net');const s=net.connect(3000,'127.0.0.1',()=>{s.end();process.exit(0)});s.on('error',()=>process.exit(1))
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    networks:
      - mini-banking

volumes:
  bank_postgres_data:
  ca_issued_certs:
  gateway_redis_data:

networks:
  mini-banking:
    name: mini-banking-network
    driver: bridge
