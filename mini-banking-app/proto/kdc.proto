syntax = "proto3";

package kdc;

option go_package = "mini_banking/pkg/pb/kdc;kdcpb";

// KDCService implements the Kerberos-like AS and TGS exchanges.
service KDCService {
  rpc RequestTGT(ASRequest) returns (ASResponse);
  rpc RequestServiceTicket(TGSRequest) returns (TGSResponse);

  // Admin dashboard read-only key-issuance audit log. Trust boundary: this RPC
  // is only reachable on the internal TLS gRPC network; admin authn/authz is
  // enforced by the API Gateway before it forwards the call.
  rpc ListAuditEvents(ListAuditEventsRequest) returns (ListAuditEventsResponse);

  // Replays the audit hash chain and reports the first tampering, if any.
  rpc VerifyAuditChain(VerifyAuditChainRequest) returns (VerifyAuditChainResponse);
}

message ASRequest {
  string owner_id = 1;
  string cert_sn = 2;
  bytes nonce = 3;
  int64 timestamp = 4;
  bytes signature = 5;
}

message ASResponse {
  bytes as_rep = 1;
  int64 tgt_expires_at_unix = 2;
}

message TGSRequest {
  bytes tgt = 1;
  bytes authenticator = 2;
  string scope = 3;
  string service_id = 4;
  string cert_sn = 5;
  bytes nonce = 6;
}

message TGSResponse {
  bytes tgs_rep = 1;
  int64 ticket_expires_at_unix = 2;
  string scope = 3;
  string service_id = 4;
}

message ListAuditEventsRequest {
  string action = 1; // empty means all actions
  string client_id = 2;
  string cert_serial = 3;
  string request_id = 4;
  int64 from_unix = 5; // zero means no lower time bound
  int64 to_unix = 6;   // zero means no upper time bound
  int32 limit = 7;
  int32 offset = 8;
}

message KdcAuditRecord {
  string id = 1;
  string action = 2;
  string client_id = 3;
  string cert_serial = 4;
  string scope = 5;
  string reason = 6;
  string request_id = 7;
  string ip = 8;
  string metadata_json = 9;
  int64 created_at_unix = 10;
}

message ListAuditEventsResponse {
  repeated KdcAuditRecord events = 1;
  int32 total = 2;
  int32 limit = 3;
  int32 offset = 4;
}

message VerifyAuditChainRequest {}

message VerifyAuditChainResponse {
  bool ok = 1;
  int32 checked = 2;
  int64 broken_seq = 3;
  string broken_id = 4;
  string detail = 5;
}

message TicketPayload {
  string owner_id = 1;
  string cert_sn = 2;
  bytes session_key = 3; // client-service session key (k_{c, v}: KDC sinh trong TGS exchange)
  string scope = 4;
  string service_id = 5;
  int64 issued_at_unix = 6;
  int64 expires_at_unix = 7;
  string key_version = 8;
  string ticket_id = 9;
}
