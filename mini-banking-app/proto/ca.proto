syntax = "proto3";

package ca;

option go_package = "mini_banking/pkg/pb/ca;capb";

// CAService owns the X.509 certificate lifecycle and is the single source of
// truth for client public keys, certificate validity, and revocation status.
service CAService {
  // Registers a user certificate from a CSR after proof-of-possession checks.
  rpc RegisterUser(RegisterUserRequest) returns (RegisterUserResponse);

  // Verifies a certificate by serial number and returns status, validity, and
  // public key material needed by KDC/Bank callers.
  rpc VerifyCertificate(VerifyCertificateRequest) returns (VerifyCertificateResponse);

  // Deprecated compatibility lookup. New KDC/Bank code should use VerifyCertificate.
  rpc GetCertificate(GetCertificateRequest) returns (GetCertificateResponse) {
    option deprecated = true;
  }

  // Deprecated compatibility status check. New KDC/Bank code should use VerifyCertificate.
  rpc CheckRevocation(CheckRevocationRequest) returns (CheckRevocationResponse) {
    option deprecated = true;
  }

  // Admin dashboard list/search.
  rpc ListCertificates(ListCertificatesRequest) returns (ListCertificatesResponse);

  // Admin dashboard detail view. This records an audit event in CA Service.
  rpc GetCertificateDetail(GetCertificateDetailRequest) returns (GetCertificateDetailResponse);

  // Admin dashboard revoke action.
  rpc RevokeCertificate(RevokeCertificateRequest) returns (RevokeCertificateResponse);

  // Admin dashboard audit log listing with filters and pagination.
  rpc ListAuditEvents(ListAuditEventsRequest) returns (ListAuditEventsResponse);

  // Records a Registration Authority / admin-auth audit event submitted by the
  // API Gateway (acting as the PKI RA). Only whitelisted ra_*/admin_ca_login_*
  // actions are accepted; certificate-lifecycle actions cannot be forged here.
  rpc AppendAuditEvent(AppendAuditEventRequest) returns (AppendAuditEventResponse);

  // Replays the audit hash chain and reports the first tampering, if any.
  rpc VerifyAuditChain(VerifyAuditChainRequest) returns (VerifyAuditChainResponse);
}

enum CertStatus {
  CERT_STATUS_UNKNOWN = 0;
  CERT_STATUS_ACTIVE = 1;
  CERT_STATUS_REVOKED = 2;
  CERT_STATUS_EXPIRED = 3;
}

enum IdentityRole {
  IDENTITY_ROLE_UNKNOWN = 0;
  IDENTITY_ROLE_CUSTOMER = 1;
  IDENTITY_ROLE_BANK_ADMIN = 2;
  IDENTITY_ROLE_CA_ADMIN = 3;
}

message CertificateMetadata {
  string serial_number = 1;
  string owner_id = 2;
  string subject_cn = 3;
  string subject_email = 4;
  string fingerprint_sha256 = 5;
  CertStatus status = 6;
  int64 not_before_unix = 7;
  int64 not_after_unix = 8;
  int64 issued_at_unix = 9;
  int64 revoked_at_unix = 10;
  string revocation_reason = 11;
  string cert_type = 12;
  string issuer_id = 13;
  string issuer_common_name = 14;
  string issuer_serial_number = 15;
  string chain_pem = 16;
  repeated string chain_fingerprints = 17;
  bool is_ca = 18;
  repeated string key_usage = 19;
  repeated string extended_key_usage = 20;
}

message RegisterUserRequest {
  string csr_pem = 1;
  string owner_id = 2;
  string subject_email = 3;
  string full_name = 4;
  IdentityRole role = 5;
}

message RegisterUserResponse {
  string certificate_pem = 1;
  string serial_number = 2;
  int64 not_before_unix = 3;
  int64 not_after_unix = 4;
  string fingerprint_sha256 = 5;
  string cert_type = 6;
  string issuer_id = 7;
  string issuer_common_name = 8;
  string issuer_serial_number = 9;
  string chain_pem = 10;
  repeated string chain_fingerprints = 11;
}

message VerifyCertificateRequest {
  string serial_number = 1;
  string caller = 2;
  bool include_certificate_pem = 3;
  bool include_public_key_pem = 4;
}

message VerifyCertificateResponse {
  CertStatus status = 1;
  string owner_id = 2;
  string subject_email = 3;
  string certificate_pem = 4;
  string public_key_pem = 5;
  string fingerprint_sha256 = 6;
  int64 not_before_unix = 7;
  int64 not_after_unix = 8;
  int64 revoked_at_unix = 9;
  string revocation_reason = 10;
  string cert_type = 11;
  string issuer_id = 12;
  string issuer_common_name = 13;
  string issuer_serial_number = 14;
  string chain_pem = 15;
  repeated string chain_fingerprints = 16;
  IdentityRole role = 17;
}

message GetCertificateRequest {
  string serial_number = 1;
}

message GetCertificateResponse {
  string certificate_pem = 1;
  string  owner_id = 2;
  CertStatus status = 3;
  int64 not_after_unix = 4;
  string public_key_pem = 5;
}

message CheckRevocationRequest {
  string serial_number = 1;
}

message CheckRevocationResponse {
  CertStatus status = 1;
  string reason = 2;
  int64 revoked_at = 3;
}

message ListCertificatesRequest {
  string status = 1;
  string owner_id = 2;
  string subject_email = 3;
  string serial_number = 4;
  int32 limit = 5;
  int32 offset = 6;
  string performed_by = 7;
  string cert_type = 8;
  string issuer_id = 9;
}

message ListCertificatesResponse {
  repeated CertificateMetadata certificates = 1;
  int32 total = 2;
  int32 limit = 3;
  int32 offset = 4;
}

// Trace context note: the gateway's X-Request-ID travels as gRPC metadata key
// "x-request-id" (transport concern), not as a message field. Only domain data
// that is persisted (performed_by) or filtered on (audit request_id in Bank)
// belongs in message bodies.
message GetCertificateDetailRequest {
  string serial_number = 1;
  string performed_by = 2;
}

message GetCertificateDetailResponse {
  CertificateMetadata certificate = 1;
}

message RevokeCertificateRequest {
  string serial_number = 1;
  string reason = 2;
  string performed_by = 3;
}

message RevokeCertificateResponse {
  CertificateMetadata certificate = 1;
}

message ListAuditEventsRequest {
  string action = 1;
  string serial_number = 2;
  string performed_by_filter = 3;
  int64 from_unix = 4;
  int64 to_unix = 5;
  int32 limit = 6;
  int32 offset = 7;
  string performed_by = 8;
  string request_id = 9; // filters events whose metadata.request_id matches (trace correlation)
}

message AuditEventRecord {
  string serial_number = 1;
  string action = 2;
  string performed_by = 3;
  string reason = 4;
  int64 performed_at_unix = 5;
  map<string, string> metadata = 6;
  string cert_type = 7;
  string issuer_id = 8;
}

message ListAuditEventsResponse {
  repeated AuditEventRecord events = 1;
  int32 total = 2;
  int32 limit = 3;
  int32 offset = 4;
}

message AppendAuditEventRequest {
  string action = 1;        // must be a whitelisted ra_*/admin_ca_login_* action
  string serial_number = 2; // may be empty for RA events with no certificate yet
  string performed_by = 3;  // actor, e.g. "ra:otp", "admin-ca:<email>"
  string reason = 4;
  map<string, string> metadata = 5;
}

message AppendAuditEventResponse {
  bool recorded = 1;
}

message VerifyAuditChainRequest {}

message VerifyAuditChainResponse {
  bool ok = 1;
  int32 checked = 2;
  int64 broken_seq = 3;
  string broken_id = 4;
  string detail = 5;
}
