syntax = "proto3";

package minibank.bank.v1;

option go_package = "minibank/proto/bank/v1;bankv1";

service BankService {
  rpc TransferMoney(TransferRequest) returns (TransferResponse);
  rpc GetBalance(BalanceRequest) returns (BalanceResponse);
  rpc GetTransactions(TransactionHistoryRequest) returns (TransactionHistoryResponse);
}

message TransferRequest {
  bytes ticket_v = 1;
  bytes authenticator = 2;
  bytes cipher = 3;
  string cert_sn = 4;
  string idempotency_key = 5;
}

message TransferResponse {
  bytes ap_rep = 1;
  string transaction_id = 2;
}

message BalanceRequest {
  bytes ticket_v = 1;
  bytes authenticator = 2;
  string account_id = 3;
  string cert_sn = 4;
}

message BalanceResponse {
  bytes ap_rep = 1;
  int64 balance = 2;
  string currency = 3;
}

message TransactionHistoryRequest {
  bytes ticket_v = 1;
  bytes authenticator = 2;
  string account_id = 3;
  string cert_sn = 4;
  string cursor_last_tx_id = 5;
  int32 limit = 6;
  int64 from_ts = 7;
  int64 to_ts = 8;
}

message TransactionHistoryResponse {
  bytes ap_rep = 1;
  repeated TransactionRecord records = 2;
  string next_cursor = 3;
  bool has_more = 4;
}

message TransactionRecord {
  string transaction_id = 1;
  string from_account = 2;
  string to_account = 3;
  int64 amount = 4;
  string currency = 5;
  string memo = 6;
  int64 created_at = 7;
  string status = 8;
  repeated TransactionStatusTrail status_trail = 9;
}

message TransactionStatusTrail {
  string status_before = 1;
  string status_after = 2;
  string changed_by = 3;
  int64 changed_at = 4;
  string notes = 5;
}
